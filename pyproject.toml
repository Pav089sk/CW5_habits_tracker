[project]
name = "cw5-habits-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "PavelShalev",email = "pav089sk@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.0,<6.1)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "drf-yasg (>=1.21.18,<2.0.0)",
    "django-filter (>=26.2,<27.0)",
    "celery (>=5.7.0,<6.0.0)",
    "redis (>=8.2.0,<9.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.5.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)"
]

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
    | migrations/
  )/
)
'''